[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "owp_milp_optimization"
description = "District heating system unit design and dispatch optimization dashboard using Mixed Integer Linear Programming (MILP)."
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Malte Fritz", email = "malte.fritz@web.de" },
    { name = "Jonas Freißmann", email = "jonas.freissmann@web.de" }
]
keywords = [
    "district heating system",
    "energy system modelling",
    "design optimization",
    "dispatch optimization",
    "MILP",
    "oemof.solph",
    "streamlit",
    "open-source web dashboard",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "streamlit>=1.51.0,!=1.59.0",
    "oemof.solph==0.6.5",
    "pandas>=2.2.2",
    "highspy==1.15.1",
    "jinja2>=3.0.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "build",
    "flit",
    "furo",
    "pytest",
    "sphinx>=7.2.2",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinxcontrib.bibtex",
]

[project.scripts]
owp-milp-optimization = "owp_milp_optimization.cli:main"

[project.urls]
Homepage = "https://github.com/maltefritz/owp_milp_optimization"
Documentation = "https://owp-milp-optimization.readthedocs.io/de/latest/"
Issues = "https://github.com/maltefritz/owp_milp_optimization/issues"
Changelog = "https://owp-milp-optimization.readthedocs.io/de/latest/Dokumentation/whats_new.html"

[tool.flit.sdist]
exclude = [
    "docs/_build"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true

[tool.esbonio.sphinx]
pythonCommand = "${venv:.venv}"